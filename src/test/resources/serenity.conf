serenity.project.name = "La Botica del Alquimista"
serenity.test.root =  features
serenity.requirements.dir = features
serenity.requirements.base.dir = src/test/resources
serenity.outputDirectory = target/site/serenity
serenity.report.encoding=UTF8
serenity.take.screenshots = FOR_EACH_ACTION
webdriver.timeouts.implicitlywait=15000
# Navegador nuevo por escenario: la tienda guarda sesion, carrito, cupon y stock en localStorage,
# asi cada escenario arranca con los datos iniciales de la HU-01.
serenity.restart.browser.for.each = scenario

serenity.browser = chrome

# Chrome como navegador. Entorno por defecto "chrome": se ve el navegador al ejecutar desde Runner.java.
# GitHub Actions usa -Denvironment=headless (servidor sin pantalla).
webdriver.driver = chrome
environment = chrome

environments {
  chrome {
    webdriver {
      #driver = "chrome"
      autodownload = true
      capabilities {
        browserName = "chrome"
        acceptInsecureCerts = true
        "goog:chromeOptions" {
          args = ["--start-maximized", "--window-size=1920,1080", "--enable-automation", "--no-sandbox", "--disable-popup-blocking", "--disable-infobars", "--disable-notifications", "--remote-allow-origins=*", "--ignore-certificate-errors"]
        }
      }
    }
  }
  headless {
    webdriver {
      driver = "chrome"
      autodownload = true
      capabilities {
        browserName = "chrome"
        acceptInsecureCerts = true
        "goog:chromeOptions" {
          args = ["--headless=new", "--window-size=1920,1080", "--enable-automation", "--no-sandbox", "--disable-dev-shm-usage", "--disable-popup-blocking", "--disable-infobars", "--disable-notifications", "--remote-allow-origins=*", "--ignore-certificate-errors"]
        }
      }
    }
  }
  edge {
    webdriver {
    driver = "edge"
    autodownload = true
      capabilities {
        browserName = "MicrosoftEdge"
        "ms:edgeOptions" {
          args = ["test-type", "ignore-certificate-errors", "headless",
            "incognito", "disable-infobars", "disable-gpu", "disable-default-apps", "disable-popup-blocking"]
        }
      }
    }
  }
  firefox {
    webdriver {
      driver = "firefox"
      autodownload = true
      capabilities {
        browserName = "firefox"
        pageLoadStrategy = "normal"
        acceptInsecureCerts = true
        unhandledPromptBehavior = "dismiss"
        strictFileInteractability = true

        "moz:firefoxOptions" {
          args = ["-headless"]
          prefs {
            "javascript.options.showInConsole": false
          },
          log {"level": "info"}
        }
      }
    }
  }
}
